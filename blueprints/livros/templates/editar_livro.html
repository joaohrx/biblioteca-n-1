
{% extends "base.html" %}

{% block titulo %}Editar livro | Biblioteca n+1{% endblock %}

{% block estilos %}
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/crud.css') }}">
{% endblock %}

{% block conteudo %}

<main class="conteudo-main">

    <h1 id="bem_vindo_crud">Editar livro</h1>

    <form method="POST">

        <input
            type="text"
            name="titulo"
            id="titulo"
            placeholder="Título"
            value="{{ livro.titulo }}"
            required
        >

        <input
            type="text"
            name="autor"
            id="autor"
            placeholder="Autor"
            value="{{ livro.autor.nome }}"
            required
        >

        <input
            type="number"
            name="ano"
            id="ano"
            placeholder="Ano de publicação"
            value="{{ livro.ano }}"
            required
        >

        <input
            type="text"
            name="genero"
            id="genero"
            placeholder="Gênero"
            value="{{ livro.genero }}"
            required
        >

        <textarea
            id="descricao"
            name="descricao"
            rows="5"
            cols="40"
            placeholder="Descrição do livro (opcional)"
        >{{ livro.descricao }}</textarea>

        <button type="submit">Salvar alterações</button>

    </form>

</main>

{% endblock %}
