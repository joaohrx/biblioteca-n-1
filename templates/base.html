
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca n+1</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Times New Roman", Times, serif;
            background-color: #e9e9e9;
            color: #080808;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 100px;
            background-color: #e9e9e9;
            border-bottom: 1px solid #080808;
        }

        h1 {
            margin: 0;
            font-size: 40px;
            font-weight: normal;
        }

        nav {
            display: flex;
            align-items: center;
        }

        nav a {
            margin: 0;
            padding: 10px 18px;
            font-size: 20px;
            cursor: pointer;
            transition: color 0.3s;
            text-decoration: none;
            color: inherit;
        }

        nav a:hover {
            color: #8b7355;
        }
    </style>
</head>

<body>
    <header>
        <h1>Biblioteca n+1</h1>

        <nav>
            {% if not usuario %}
                <a href="{{ url_for('auth.cadastro') }}">Cadastro</a>
            {% else %}
                <a href="{{ url_for('auth.logout') }}">Sair</a>
                <a href="{{ url_for('livros.perfil') }}">Perfil</a>
            {% endif %}
        </nav>
    </header>
    {% block conteudo %}{% endblock %}
</body>
</html>
