
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca n+1</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/base.css') }}">

    {% block estilos %}{% endblock %}
</head>

<body>
    <header>
        <h1>Biblioteca n+1</h1>

        <nav>
            {% if not usuario %}
                <a href="{{ url_for('auth.cadastro') }}">Cadastro</a>
                <a href="{{ url_for('auth.login') }}">Login</a>
            {% else %}
                <a href="{{ url_for('livros.home') }}">Home</a>
                <a href="{{ url_for('livros.perfil') }}">Perfil</a>
                <a href="{{ url_for('auth.logout') }}">Sair</a>
            {% endif %}
        </nav>
    </header>

    {% block conteudo %}{% endblock %}

    
    <footer>
        <hr>
        <div class="rodape">
            <span>Biblioteca n+1</span>
            <span id="copyright">© 2026</span>
        </div>
    </footer>
</body>
</html>
